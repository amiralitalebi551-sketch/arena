name: build-image

# Builds the VLESS+WS server image and pushes it to ghcr.io, so ClawCloud Run can
# pull it by name. No Docker needed on your machine, no credit card anywhere.
#
#   Image:  ghcr.io/<owner>/<repo>/xray-vless:latest
#
# First run only: make the package PUBLIC (see the last step / README) so the
# platform can pull it anonymously.

on:
  workflow_dispatch:
    inputs:
      xray_version:
        description: 'Xray-core tag (latest = newest release)'
        default: 'latest'
      platforms:
        description: 'Target platforms'
        default: 'linux/amd64,linux/arm64'
      make_public:
        description: 'Try to flip the ghcr package to public'
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/build-image.yml']

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/xray-vless

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: prep
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "stamp=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Build & push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          provenance: false
          sbom: false
          build-args: |
            XRAY_VERSION=${{ inputs.xray_version || 'latest' }}
            OCI_SOURCE=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.prep.outputs.sha }}
            ${{ env.IMAGE }}:${{ steps.prep.outputs.stamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make the package public (one-time, best effort)
        if: ${{ steps.push.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          PKG="${REPO}/xray-vless"
          ENC="$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=""))' "$PKG")"
          for p in "/user/packages/container/${ENC}/visibility" "/users/${OWNER}/packages/container/${ENC}/visibility"; do
            echo "::group::POST $p"
            if gh api -X POST "$p" -f visibility=public; then
              echo "PACKAGE IS PUBLIC ✅"; echo "::endgroup::"; exit 0
            fi
            echo "::endgroup::"
          done
          echo "Could not flip visibility from CI."
          echo "Do it once by hand (2 clicks):"
          echo "  https://github.com/${OWNER}?tab=packages -> xray-vless -> Package settings"
          echo "  -> Danger Zone -> Change visibility -> Public"

      - name: Summary
        if: always()
        run: |
          {
            echo "### image built"
            echo '```'
            echo "${IMAGE}:latest"
            echo "${IMAGE}:${{ steps.prep.outputs.sha }}"
            echo '```'
            echo "Paste \`${IMAGE}:latest\` into ClawCloud App Launchpad -> Image Name."
          } >> "$GITHUB_STEP_SUMMARY"
